name: Uygulama (test + .exe)

on:
  push:
    paths-ignore:
      - "denemeler/**"
      - ".github/workflows/windows-exe.yml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-ve-derle:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # FFmpeg (LGPL sürümü; libx264 gibi GPL parçaları yok) — yerel kayıt için
      - name: FFmpeg indir (LGPL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{Authorization = "Bearer $env:GH_TOKEN"} `
            https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-lgpl-\d+\.\d+\.zip$' } |
            Sort-Object { [int]($_.name -replace '^ffmpeg-n(\d+)\.(\d+).*', '$1') * 100 + [int]($_.name -replace '^ffmpeg-n\d+\.(\d+).*', '$1') } |
            Select-Object -Last 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' } }
          Write-Host "FFmpeg: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          $ozet = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLower()
          Write-Host "FFmpeg SHA-256: $ozet"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $kok = Get-ChildItem ffmpeg_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($kok.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($kok.FullName)\LICENSE.txt" ffmpeg\LICENSE.txt
          @("FFmpeg $($asset.name) - https://github.com/BtbN/FFmpeg-Builds (LGPL)",
            "Yayın: $($rel.tag_name)", "İndirme: $($asset.browser_download_url)", "SHA-256: $ozet") |
            Out-File -Encoding utf8 ffmpeg\KAYNAK.txt
          .\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Birim testleri
        run: python -m pytest -q

      - name: Modüller Windows'ta yükleniyor mu?
        run: python -c "import ui.main_window, ui.mixer_panel, ui.shell, ui.tray, ui.toast, ui.region_overlay, ui.drawing_overlay, ui.mini_bar, ui.settings_dialog, ui.hakkinda, outputs.obs_kamera, overlay.cursor, core.recorder, capture.background_blur, overlay.drawing, capture.region, core.hotkeys, capture.screen, capture.webcam, capture.app_audio, core.audio_engine, pyaudiowpatch, comtypes, psutil, scenes.scene_manager, outputs.virtualcam, core.platform_win; print('tamam')"

      - name: .exe derle
        run: |
          pyinstaller --noconfirm --windowed --name YayinUygulamasi `
            --add-data "config/settings.default.json;config" `
            --add-data "models/selfie_segmentation_landscape.tflite;models" `
            --add-data "models/LICENSE-mediapipe-Apache-2.0.txt;models" `
            --collect-all dxcam --hidden-import mss `
            --icon kurulum/uygulama.ico `
            main.py

      - name: Zip paketi hazırla (lisanslar dahil)
        run: |
          Copy-Item README.md dist\YayinUygulamasi\BENIOKU.md
          Copy-Item -Recurse ffmpeg dist\YayinUygulamasi\ffmpeg
          python kurulum/lisanslar.py dist\YayinUygulamasi
          if ($LASTEXITCODE -ne 0) { throw "Lisanslar toplanamadı" }
          Get-Content dist\YayinUygulamasi\lisanslar\UCUNCU_PARTI_LISANSLAR.txt
          Compress-Archive -Path dist\YayinUygulamasi -DestinationPath YayinUygulamasi.zip -Force

      # Kurulum programı: kurulum yerini sorar, Başlat menüsü + masaüstü kısayolu, kaldırıcı
      - name: Kurulum programı derle (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup bulunamadı" }
          $surum = (Select-String -Path core\surum.py -Pattern 'SURUM = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Sürüm: $surum"
          & $iscc /Q "/DSurum=$surum" kurulum\kurulum.iss
          if ($LASTEXITCODE -ne 0) { throw "Kurulum programı derlenemedi" }
          Move-Item Output\YayinUygulamasi-Kurulum.exe YayinUygulamasi-Kurulum.exe
          Get-Item YayinUygulamasi-Kurulum.exe | Select-Object Name, Length

      - name: Dosya özetleri (SHA-256)
        run: |
          Get-FileHash -Algorithm SHA256 YayinUygulamasi.zip, YayinUygulamasi-Kurulum.exe |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          $surum = (Select-String -Path core\surum.py -Pattern 'SURUM = "(.+)"').Matches[0].Groups[1].Value
          "SURUM=$surum" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          python kurulum/surum_notu.py $surum surum_notu.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md'de $surum sürümünün notu yok" }

      - uses: actions/upload-artifact@v4
        with:
          name: YayinUygulamasi
          path: |
            YayinUygulamasi.zip
            YayinUygulamasi-Kurulum.exe
            SHA256SUMS.txt

      # Sadece main'e birleşen kod indirme sayfasına gider; dallar sadece test edilir.
      - name: İndirme sayfasına koy (Releases)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uygulama
          name: Yayın Uygulaması - son sürüm
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Sürüm ${{ env.SURUM }}. Her sürümün kalıcı kopyası Releases'te v<sürüm> adıyla durur.
            Kurmak için: YayinUygulamasi-Kurulum.exe'yi indir ve çalıştır (kurulum yerini sorar,
            Başlat menüsüne ve istersen masaüstüne kısayol ekler; Ayarlar > Uygulamalar'dan kaldırılır).
            Kurmadan denemek için: YayinUygulamasi.zip'i bir klasöre çıkar, YayinUygulamasi.exe'yi çalıştır.
            Lisans: GNU GPL sürüm 3 (özgür ve açık kaynak). Kaynak kod bu depoda; kullanılan
            kütüphanelerin lisansları paketteki "lisanslar" klasöründe.
            (Derlenen commit: ${{ github.sha }})
          files: |
            YayinUygulamasi.zip
            YayinUygulamasi-Kurulum.exe
            SHA256SUMS.txt

      # Her sürüm numarası için bir kez kalıcı sürüm (v1.5.0 gibi): sonradan üstüne yazılmaz,
      # sorun bildiren kişinin hangi paketi kullandığı bilinir, eskiye dönülebilir.
      # Zip konmaz (guncelle.bat sadece "uygulama"dakini indirsin); kurulum programı ve özetler konur.
      - name: Sürüm numaralı kalıcı sürüm
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $etiket = "v$env:SURUM"
          gh release view $etiket *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$etiket zaten var, dokunulmadı"; exit 0 }
          gh release create $etiket YayinUygulamasi-Kurulum.exe SHA256SUMS.txt `
            --title "Yayın Uygulaması $env:SURUM" --notes-file surum_notu.md --target $env:GITHUB_SHA --latest
