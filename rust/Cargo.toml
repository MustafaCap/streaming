[package]
name = "rizeon"
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RizeOn: arka planda çalışan, internetsiz toplantı yardımcısı"
repository = "https://github.com/MustafaCap/streaming"
publish = false

[[bin]]
name = "RizeOn"
path = "src/main.rs"

[lib]
name = "rizeon"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fast_image_resize = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico"] }
ab_glyph = "0.2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
nnnoiseless = { version = "0.5", default-features = false }
resvg = { version = "0.49", default-features = false }


[target.'cfg(target_os = "linux")'.dependencies]
# Sadece geliştirme/test için Linux'ta da derlensin
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
] }
windows-core = "0.62"
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
